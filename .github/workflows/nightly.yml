name: 'nightly'

on:
  schedule:
    - cron: '0 0 * * *'
  push:
    branches:
      - master
      - riscv32-port

permissions:
  contents: write

jobs:
  nightly-release:
    name: Build Nightly Release
    runs-on: ubuntu-latest
    steps:
      - name: Install Dependencies
        run: sudo apt-get update && sudo apt-get install libusb-1.0-0-dev libftdi1-dev libudev-dev
      - uses: actions/checkout@v2
        with:
          submodules: true
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
      - uses: Swatinem/rust-cache@v1
      - uses: actions-rs/cargo@v1
        with:
          command: build
          args: --profile binrelease

      - name: Upload Release
        run: |
          # A fork starts with no releases; create the one we upload into.
          gh release view --repo "${REPO}" nightly > /dev/null 2>&1 ||
              gh release create --repo "${REPO}" nightly --prerelease \
                  --target "${GITHUB_SHA}" --title nightly \
                  --notes "Humility built from the latest push."
          gh release upload --repo "${REPO}" nightly --clobber target/binrelease/humility
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
